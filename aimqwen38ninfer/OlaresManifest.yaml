spec:
  versionName: '26.9.3'
  fullDescription: |
    AIM Qwen3.8 27B-N serves Qwen3.8-27B with the NInfer C++/CUDA inference engine, purpose-built for a single NVIDIA GeForce RTX 5090 (sm_120a).

    **Model**
    neroued/Qwen3.8-27B-nvfp4-NInfer (container v3, 22.1 GiB, SHA-256 verified) — mixed NVFP4 (MLP layers 0-55) and row-scaled FP8 (attention, GDN, embedding, output head) weights derived from Qwen3.8-27B. Native Vision, MTP and DFlash2 companion weights included.

    **Inference Engine**
    NInfer (upstream Neroued/ninfer, pinned revision) compiled for CUDA 13.1 sm_120a. MTP speculative decoding with 3 draft tokens and the optimized proposal head. NVFP4 KV cache at 103,936-token context on 24 GB.

    **Key Features**
    OpenAI Chat Completions and Responses APIs, Anthropic Messages API, function/tool calling (tool_choice auto/none/allowed_tools), compatible-prefix reuse, CUDA Graph decode, reasoning control (reasoning_effort, enable_thinking, preserve-thinking), image/video input.

    **API**
    OpenAI-compatible at /v1/chat/completions, /v1/responses, /v1/models; Anthropic at /v1/messages; health at /health.

    **Resource Usage**
    One RTX 5090 (24 GB) exclusively, ~20 GiB VRAM for weights, ~4 GB host RAM pinned for state caches.
  upgradeDescription: |
    Initial Release for AImighty Olares One
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen38ninfer
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen38ninfer
  requiredCpu: "4"

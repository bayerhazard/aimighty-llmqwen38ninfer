apiVersion: v1
kind: ConfigMap
metadata:
  name: aimqwen38ninfer-env
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimqwen38ninfer
    app.kubernetes.io/managed-by: Helm
data:
  MODEL_FILE: "{{ .Values.env.MODEL_FILE }}"
  MODEL_URL: "{{ .Values.env.MODEL_URL }}"
  MODEL_ALIAS: "{{ .Values.env.MODEL_ALIAS }}"
  MAX_CONTEXT: "{{ .Values.env.MAX_CONTEXT }}"
  KV_DTYPE: "{{ .Values.env.KV_DTYPE }}"
  MAX_CONCURRENCY: "{{ .Values.env.MAX_CONCURRENCY }}"
  MAX_PENDING: "{{ .Values.env.MAX_PENDING }}"
  PENDING_TIMEOUT_MS: "{{ .Values.env.PENDING_TIMEOUT_MS }}"
  PREFILL_CHUNK: "{{ .Values.env.PREFILL_CHUNK }}"
  MAX_REQUEST_MIB: "{{ .Values.env.MAX_REQUEST_MIB }}"
  HOST_STATE_SLOTS: "{{ .Values.env.HOST_STATE_SLOTS }}"
  SPEC: "{{ .Values.env.SPEC }}"
  DRAFT_TOKENS: "{{ .Values.env.DRAFT_TOKENS }}"
  THINKING_BUDGET: "{{ .Values.env.THINKING_BUDGET }}"

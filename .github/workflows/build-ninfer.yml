name: Build NInfer image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ninfer.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PIN: cde57e48fa78900235ab8bf5c5492d4cf349a43e
      TAG: cde57e48
    steps:
      - name: Checkout upstream NInfer at pin
        uses: actions/checkout@v4
        with:
          repository: Neroued/ninfer
          ref: ${{ env.PIN }}
          path: ninfer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ninfer
          file: ninfer/Dockerfile
          push: true
          tags: ghcr.io/bayerhazard/ninfer:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "**ghcr.io/bayerhazard/ninfer:${{ env.TAG }}** (upstream pin ${{ env.PIN }})" >> "$GITHUB_STEP_SUMMARY"
